name: CI

on:
  # Trigger on push to the main branch:
  push:
    branches:
      - main

  # Plan regular integrity checks:
  schedule:
    - cron: "42 3 22 * *"
    - cron: "13 1 14 * *"

  # Provide the option to run it manually if required:
  workflow_dispatch:

jobs:
  type-check:
    # Run type checking only on push to the main branch:
    if: github.event_name == 'push'

    # Use ubuntu-latest as required for compatibility:
    runs-on: ubuntu-latest

    # Define read-only permission:
    permissions:
      contents: read

    steps:
      # 0. Init project sources:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Install Node.js runtime for Wrangler and TypeScript tools:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 2. Install Node.js dependencies:
      - name: Install Node.js dependencies
        run: npm ci

      # 3. Generate Wrangler types for the TypeScript project:
      - name: Generate Wrangler types
        run: npm run types

      # 4. Run TypeScript type checking:
      - name: TypeScript type check
        run: npm run check-types

  integrity-test:
    # Run integrity test on push, manual trigger and scheduled CI check:
    if: github.event_name != 'schedule' || github.event.schedule == '42 3 22 * *'

    # Use ubuntu-latest as required for compatibility:
    runs-on: ubuntu-latest

    # Define read-only permission:
    permissions:
      contents: read

    steps:
      # 0. Init project sources:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Install Node.js runtime for Wrangler:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 2. Set up Python for the test script:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 3. Install Node.js dependencies:
      - name: Install Node.js dependencies
        run: npm ci

      # 4. Install Python dependencies:
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 5. Create .dev.vars:
      - name: Create .dev.vars
        run: |
          echo "IP_HASH_SALT=\"${{ secrets.IP_HASH_SALT }}\"" > .dev.vars

      # 6. Start Wrangler Dev in the background:
      - name: Start Wrangler Dev (Background)
        run: |
          npm run dev -- --show-interactive-dev-session=false --port 8787 &
          sleep 15

      # 7. Execute the health check script against the local worker:
      - name: Run API integrity test suite
        run: |
          curl -sL "${{ vars.GIST_TEST_SCRIPT }}" -o meteorites-api.py && \
          python meteorites-api.py \
            --remote "http://localhost:8787" \
            --timeout 25 \
            --delay 10 \
            --max-radius 2500 \
            --max-random 1000 \
            --max-search 500

  dataset-diff-check:
    # Run dataset comparison on push, manual trigger and scheduled dataset check:
    if: github.event_name != 'schedule' || github.event.schedule == '13 1 14 * *'

    # Execute this job on a Linux environment:
    runs-on: ubuntu-latest

    # Define read-only permission:
    permissions:
      contents: read

    steps:
      # 0. Initialize project sources:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Install the Python interpreter:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 2. Download and run the meteorites comparison script:
      - name: Compare meteorites dataset
        run: |
          curl -sL "${{ vars.GIST_COMPARE_SCRIPT }}" -o meteorites-diff.py && \
          python meteorites-diff.py \
            --local-file "data/meteorites.csv" \
            --remote-file "${{ vars.METEORITES_REMOTE_CSV }}"